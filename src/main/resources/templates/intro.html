<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>한수부탁 소개</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        .hero-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: none;
            transition: transform 0.3s;
        }
        .hero-card:hover { transform: scale(1.02); }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-5 shadow-lg hero-card text-center rounded-4">
            <div class="mb-4 display-1 text-primary">
                <i class="bi bi-table"></i>
            </div>
            
            <h1 class="mb-4 fw-bold text-dark">안녕하세요. <span class="text-primary">한수부탁</span>입니다.</h1>
            
            <div class="border-start border-4 border-primary ps-3 text-start mx-auto my-4" style="max-width: 500px;">
                <p class="lead mb-2"><i class="bi bi-calendar-check-fill text-success me-2"></i>매주 <b>수요일, 금요일</b> 신사리탁구 교실에서 리그전을 합니다.</p>
                <p class="lead"><i class="bi bi-building-fill text-warning me-2"></i>짝수달에는 탁구장을 대관하여 리그전을 합니다.</p>
            </div>
            
            <hr class="my-4">
            
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-outline-primary btn-lg px-4 rounded-pill">
                    <i class="bi bi-house-door"></i> 홈으로
                </a>
                <a href="/board" class="btn btn-primary btn-lg px-4 rounded-pill">
                    <i class="bi bi-chat-dots"></i> 게시판 가기
                </a>
            </div>
        </div>
    </div>
</body>
</html>
