<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>관리자 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🔧 관리자 대시보드</h2>
            <a href="/admin/logout" class="btn btn-danger">로그아웃</a>
        </div>

        <div class="row">
            <!-- 선수 관리 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5>선수 관리</h5>
                    </div>
                    <div class="card-body">
                        <a href="/players" class="btn btn-primary mb-3">선수 목록</a>
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>이름</th>
                                    <th>액션</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="player : ${players}">
                                    <td th:text="${player.name}"></td>
                                    <td>
                                        <form action="/admin/players/delete" method="post" style="display:inline;">
                                            <input type="hidden" name="id" th:value="${player.id}">
                                            <button type="submit" class="btn btn-sm btn-danger" 
                                                    onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 경기 관리 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5>경기 관리</h5>
                    </div>
                    <div class="card-body">
                        <a href="/matches" class="btn btn-success mb-3">경기 목록</a>
                        <form action="/admin/matches/delete-all" method="post">
                            <div class="mb-3">
                                <label>날짜별 경기 초기화</label>
                                <input type="date" name="date" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100"
                                    onclick="return confirm('정말 모든 경기를 삭제하시겠습니까?')">
                                경기 초기화
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 일반 페이지로 돌아가기 -->
        <div class="mt-4">
            <a href="/" class="btn btn-secondary">메인 페이지</a>
            <a href="/players" class="btn btn-info">선수 목록</a>
            <a href="/matches" class="btn btn-warning">경기 관리</a>
            <a href="/board" class="btn btn-primary">게시판</a>
        </div>
    </div>
</body>
</html>
