<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리그 날씨 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        
        .weather-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }
        
        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15) !important;
        }
        
        @media (max-width: 576px) {
            h2 {
                font-size: 1.5rem;
                margin-bottom: 2rem;
            }
            
            .col-12-xs {
                flex: 0 0 100%;
                max-width: 100%;
            }
        }
        
        @media (min-width: 577px) and (max-width: 768px) {
            .col-sm-6-custom {
                flex: 0 0 50%;
                max-width: 50%;
            }
        }
        
        @media (min-width: 769px) and (max-width: 992px) {
            .col-md-4-custom {
                flex: 0 0 33.333%;
                max-width: 33.333%;
            }
        }
        
        @media (min-width: 993px) {
            .col-lg-3-custom {
                flex: 0 0 25%;
                max-width: 25%;
            }
        }
        
        .card-header {
            padding: 1rem;
        }
        
        .card-body {
            padding: 1.25rem;
        }
        
        .btn-custom {
            width: 100%;
            max-width: 300px;
        }
        
        @media (max-width: 576px) {
            .btn-custom {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
    <body>
        <div class="container-fluid">
            <h2 class="text-center mb-4 fw-bold">주간 상세 날씨 예보</h2>
            
            <div class="row g-3 g-md-4">
                <div class="col-12-xs col-sm-6-custom col-md-4-custom col-lg-3-custom mb-3" th:each="w : ${weatherList}">
                    <div class="card weather-card shadow-sm border-0 rounded-4"
                        th:classappend="${w.targetDate == today} ? 'border border-warning border-3' : ''">
                        
                        <div class="card-header text-white text-center rounded-top-4"
                            th:classappend="${w.targetDate == today} ? 'bg-warning text-dark' : 'bg-primary'">
                            
                            <div class="fw-bold">
                                <span th:text="${#strings.substring(w.targetDate,4,6) + '.' + #strings.substring(w.targetDate,6,8)}">날짜</span>
                                <span th:text="'(' + ${weekdayMap[w.targetDate]} + ')'">요일</span>
                            </div>
                            <!-- ✅ 오늘만 뱃지 표시 -->
                            <small th:if="${w.targetDate == today}" class="badge bg-dark mt-2 d-inline-block">오늘</small>
                        </div>

                        <div class="card-body text-center">
                            <h4 class="card-title fw-bold mb-2"
                                th:classappend="${w.targetDate == today} ? 'text-warning' : 'text-primary'"
                                th:text="${w.temp} + '°C'"></h4>
                            <p class="card-text text-muted mb-0">강수확률: <span th:text="${w.pop}"></span>%</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-5 pb-5">
                <a href="/" class="btn btn-lg btn-outline-secondary btn-custom">홈으로 돌아가기</a>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
