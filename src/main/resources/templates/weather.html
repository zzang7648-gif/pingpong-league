<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>리그 날씨 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background-color: #f8f9fa; } </style>
</head>
<body class="container mt-5">
    <h2 class="text-center mb-4 fw-bold">주간 상세 날씨 예보</h2>
    
    <div class="row">

        <div class="col-md-3 mb-4" th:each="w : ${weatherList}">
            <div class="card h-100 shadow-sm border-0 rounded-4"
                th:classappend="${w.targetDate == today} ? 'border border-warning border-3' : ''">
                
                <div class="card-header text-white text-center rounded-top-4"
                    th:classappend="${w.targetDate == today} ? 'bg-warning text-dark' : 'bg-primary'">
                    
                    <div class="fw-bold">
                        <span th:text="${#strings.substring(w.targetDate,4,6) + '.' + #strings.substring(w.targetDate,6,8)}">날짜</span>
                        <span th:text="'(' + ${weekdayMap[w.targetDate]} + ')'">요일</span>
                    </div>
                    <!-- ✅ 오늘만 뱃지 표시 -->
                    <small th:if="${w.targetDate == today}" class="badge bg-dark mt-1">오늘</small>
                </div>

                <div class="card-body text-center p-3">
                    <h4 class="card-title fw-bold"
                        th:classappend="${w.targetDate == today} ? 'text-warning' : 'text-primary'"
                        th:text="${w.temp} + '°C'"></h4>
                    <p class="card-text text-muted">강수확률: <span th:text="${w.pop}"></span>%</p>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-4 pb-5">
        <a href="/" class="btn btn-lg btn-outline-secondary">홈으로 돌아가기</a>
    </div>
</body>
</html>
