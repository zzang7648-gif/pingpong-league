<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>리그 날씨 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                    <h3 class="mb-0">오늘의 경기 날씨</h3>
                </div>
                
                <div class="card-body p-4" th:if="${weather != null}">
                    <div class="d-flex justify-content-around text-center my-4">
                        <div>
                            <h5 class="text-muted">기온</h5>
                            <h2 class="fw-bold text-primary" th:text="${weather.temp + '°C'}"></h2>
                        </div>
                        <div>
                            <h5 class="text-muted">강수 확률</h5>
                            <h2 class="fw-bold text-primary" th:text="${weather.pop + '%'}"></h2>
                        </div>
                    </div>
                    
                    <div class="alert alert-info mt-3" role="alert">
                        <strong>참고:</strong> 외부 환경에 따라 경기력이 달라질 수 있습니다. 쾌적한 경기를 즐기세요!
                    </div>
                </div>

                <div class="card-body p-4 text-center" th:if="${weather == null}">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3">날씨 데이터를 가져오고 있습니다...</p>
                </div>

                <div class="card-footer bg-white border-0 text-center pb-4">
                    <a href="/" class="btn btn-outline-secondary">홈으로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
