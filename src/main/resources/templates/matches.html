<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Master Genius 리그 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <!-- 1. 참가자 명단 및 ELO 관리 -->
    <div class="row mb-5">
        <div class="col-12">
            <h3>1. 참가자 명단 (기본 ELO 1500)</h3>
            <table class="table table-bordered">
                <thead>
                    <tr><th>이름</th><th>승</th><th>패</th><th>ELO</th></tr>
                </thead>
                <tbody>
                    <tr th:each="player : ${players}">
                        <td th:text="${player.name}"></td>
                        <td th:text="${player.win}"></td>
                        <td th:text="${player.lose}"></td>
                        <td>1500</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 2. 대진 자동 생성 -->
    <div class="row mb-5">
        <div class="col-12">
            <h3>2. 오늘의 대진 생성</h3>
            <form action="/matches/generate" method="post" class="p-3 border rounded bg-light">
                <div class="mb-3">
                    <th:block th:each="player : ${players}">
                        <input type="checkbox" name="selectedPlayerNames" th:value="${player.name}" th:id="'p'+${player.id}">
                        <label th:for="'p'+${player.id}" th:text="${player.name}" class="me-3"></label>
                    </th:block>
                </div>
                <button type="submit" class="btn btn-success">선택한 인원 리그 대진 자동 생성</button>
            </form>
        </div>
    </div>

    <!-- 3. 리그 기록 및 점수 입력 -->
    <div class="row">
        <div class="col-12">
            <h3>3. 리그 기록</h3>
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr><th>선수1</th><th>점수</th><th>vs</th><th>점수</th><th>선수2</th><th>입력</th></tr>
                </thead>
                <tbody>
                    <tr th:each="match : ${matches}">
                        <form action="/matches/update" method="post">
                            <input type="hidden" name="id" th:value="${match.id}">
                            <td th:text="${match.player1}"></td>
                            <td><input type="number" name="score1" th:value="${match.score1}" class="form-control form-control-sm"></td>
                            <td>vs</td>
                            <td><input type="number" name="score2" th:value="${match.score2}" class="form-control form-control-sm"></td>
                            <td th:text="${match.player2}"></td>
                            <td><button type="submit" class="btn btn-sm btn-primary">저장</button></td>
                        </form>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
