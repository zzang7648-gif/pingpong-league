<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오늘의 리그</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <div th:replace="~{layout/header :: header}"></div>

    <div class="row mb-5">
        <div class="col-12">
            <h3>1. TOP 10 (기본 ELO 1500)</h3>
            <table class="table table-bordered">
                <thead><tr><th>이름</th><th>승</th><th>패</th><th>ELO</th></tr></thead>
                <tbody>
                    <tr th:each="player : ${topPlayers}">
                        <td th:text="${player.name}"></td>
                        <td th:text="${player.win}"></td>
                        <td th:text="${player.lose}"></td>
                        <td th:text="${player.elo}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col-12">
            <div class="card p-4 shadow-sm border-success">
                <h3 class="text-success mb-3">2. 오늘 리그 참가 선수 선택</h3>
                <form action="/matches/generate" method="post" id="leagueForm">
                    <div class="mb-3">
                        <label for="leagueDate" class="form-label fw-bold">리그 날짜</label>
                        <input type="date" id="leagueDate" name="matchDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">참가 선수 검색</label>
                        <input type="text" id="playerSearch" class="form-control" 
                               placeholder="이름 입력 후 엔터" 
                               onkeyup="filterPlayers()" 
                               onkeydown="if(event.key === 'Enter') { event.preventDefault(); handleEnterKey(); }">
                        <div id="playerDropdown" class="list-group mt-2" style="max-height: 150px; overflow-y: auto; display: none;">
                            <button type="button" class="list-group-item list-group-item-action" 
                                    th:each="player : ${players}" 
                                    th:data-name="${player.name}"
                                    onclick="addPlayer(this.getAttribute('data-name'))"
                                    th:text="${player.name}"></button>
                        </div>
                    </div>
                    <div id="selectedPlayersContainer" class="mb-3 p-2 border rounded" style="min-height: 50px;"></div>
                    <button type="submit" class="btn btn-success px-4">선택한 선수로 리그 대진 자동 생성</button>
                </form>
            </div>
        </div>
    </div>

    <div class="row" th:if="${playerGroups != null}">
        <div class="col-12" th:each="group : ${playerGroups}">
            <h3 class="mt-4 text-primary">리그 조 (총 [[${group.size()}]]명)</h3>
            <form action="/matches/save-matrix" method="post">
                <table class="table table-bordered table-sm text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>선수</th>
                            <th th:each="p : ${group}" th:text="${p.name}"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p1 : ${group}">
                            <th class="table-light" th:text="${p1.name}"></th>
                            <td th:each="p2 : ${group}">
                                <span th:if="${p1.name == p2.name}">-</span>
                                
                                <th:block th:if="${p1.name != p2.name}" th:each="match : ${matches}">
                                    <div th:if="${(match.player1 == p1.name && match.player2 == p2.name) || (match.player1 == p2.name && match.player2 == p1.name)}">
                                        <input type="number" th:name="'s1_' + ${match.id}" th:value="${match.score1}" style="width: 40px;"> :
                                        <input type="number" th:name="'s2_' + ${match.id}" th:value="${match.score2}" style="width: 40px;">
                                    </div>
                                </th:block>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <button type="submit" class="btn btn-primary w-100 mb-4">현재 조 리그 결과 일괄 저장</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('leagueDate').valueAsDate = new Date();

        function filterPlayers() {
            const input = document.getElementById('playerSearch');
            const filter = input.value.toUpperCase();
            const dropdown = document.getElementById('playerDropdown');
            const buttons = dropdown.getElementsByTagName('button');
            dropdown.style.display = input.value ? 'block' : 'none';
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].style.display = buttons[i].innerText.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        function handleEnterKey() {
            const input = document.getElementById('playerSearch');
            const val = input.value.trim();
            const dropdown = document.getElementById('playerDropdown');
            const buttons = Array.from(dropdown.querySelectorAll('button'));
            const match = buttons.find(btn => btn.style.display !== 'none' && btn.innerText.trim() === val);
            if (match) addPlayer(match.innerText);
            else alert("선수 목록을 확인하세요.");
        }

        function addPlayer(name) {
            const container = document.getElementById('selectedPlayersContainer');
            if (Array.from(container.querySelectorAll('input[type="hidden"]')).some(i => i.value === name)) return;
            const span = document.createElement('span');
            span.className = "badge bg-primary me-2 mb-2 p-2";
            span.innerHTML = `${name} <span style="cursor:pointer; margin-left:5px;" onclick="this.parentElement.remove()">x</span>`;
            const input = document.createElement('input');
            input.type = "hidden"; input.name = "selectedPlayerNames"; input.value = name;
            span.appendChild(input);
            container.appendChild(span);
            document.getElementById('playerSearch').value = '';
            document.getElementById('playerDropdown').style.display = 'none';
        }
    </script>
</body>
</html>
