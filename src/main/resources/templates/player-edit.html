<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>선수 수정</title>
</head>
<div th:replace="~{layout/header :: header}"></div>
<body>

<h1>선수 수정</h1>

<form action="/players/update" method="post">

    <input type="hidden" name="id" th:value="${player.id}">

    이름 :
    <input type="text" name="name" th:value="${player.name}">
    <br><br>

    등급 :
    <input type="text" name="grade" th:value="${player.grade}">
    <br><br>

    <button type="submit">수정 완료</button>

</form>

</body>

</html>
