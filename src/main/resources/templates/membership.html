<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>연회비 납부 현황</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div th:replace="~{layout/header :: header}"></div>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>💰 연회비 납부 현황</h2>
        <a href="/" class="btn btn-outline-secondary">홈으로 돌아가기</a>
    </div>
    
    <table class="table table-hover table-bordered">
        <thead class="table-dark text-center">
            <tr>
                <th>이름</th>
                <th>등급</th>
                <th>납부 여부</th>
                <th>최근 납부일</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="player : ${players}" class="text-center">
                <td th:text="${player.name}">이름</td>
                <td th:text="${player.grade}">등급</td>
                <td>
                    <input type="checkbox" class="form-check-input" 
                           th:checked="${player.paidMembership}" 
                           th:onchange="'fetch(\'/players/updatePayment?id=' + ${player.id} + '&paid=\' + this.checked, {method:\'POST\'})'">
                </td>
                <td th:text="${player.membershipDate}">날짜</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
