<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>탁구 소모임 홈</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5 text-center">
    
    <div class="row justify-content-center mb-5">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 bg-light">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">리그장 현재 날씨</h6>
                    <div th:if="${weather != null}">
                        <h4 class="card-title">
                            <span th:text="${weather.temp}"></span>℃
                        </h4>
                        <p class="card-text small mb-0">강수확률: <span th:text="${weather.pop}"></span>%</p>
                    </div>
                    <div th:if="${weather == null}">
                        <p class="small text-danger">날씨 정보를 불러올 수 없습니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h1 class="mb-4 fw-bold">환영합니다! 탁구 리그 시스템</h1>
    <p class="text-muted mb-5">한수부탁 탁구 리그 관리를 위한 시스템입니다.</p>

   <div class="mt-5 d-grid gap-3 col-6 mx-auto">
        <a href="/intro" class="btn btn-lg btn-outline-primary shadow-sm">한수부탁 소개</a>
        <a href="/players" class="btn btn-lg btn-secondary shadow-sm">선수 명단 보기</a>
        <a href="/matches" class="btn btn-lg btn-success shadow-sm">오늘의 리그 시작하기</a>
        <a href="/players/membership" class="btn btn-lg btn-warning text-white shadow-sm">연회비 관리</a>
        <a href="/board" class="btn btn-lg btn-info text-white shadow-sm">익명 게시판</a>
        <a href="/weather" class="btn btn-lg btn-outline-secondary shadow-sm mt-2">오늘의 날씨 상세 정보</a>
    </div>
</body>
</html>
