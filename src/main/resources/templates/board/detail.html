<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>상세보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div th:replace="~{layout/header :: header}"></div>
<body class="container mt-4">
    <h2 th:text="${post.title}">제목</h2>
    <hr><p>작성자: <span th:text="${post.nickname}"></span> | 작성일: <span th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd HH:mm')}"></span></p>
    <div class="p-3 border bg-light" th:text="${post.content}"></div>
    <hr>
    <h4>댓글</h4>
    <ul class="list-group mb-3">
        <li class="list-group-item" th:each="comment : ${comments}">
            <strong th:text="${comment.nickname}"></strong>: <span th:text="${comment.content}"></span>
        </li>
    </ul>
    <form action="/board/comment/write" method="post" class="card p-3">
        <input type="hidden" name="postId" th:value="${post.id}">
        <div class="row g-2">
            <div class="col-md-2"><input type="text" name="nickname" class="form-control" placeholder="닉네임" required></div>
            <div class="col-md-2"><input type="password" name="password" class="form-control" placeholder="비번" required></div>
            <div class="col-md-6"><input type="text" name="content" class="form-control" placeholder="댓글" required></div>
            <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">등록</button></div>
        </div>
    </form>
    <div class="mt-3"><a href="/board" class="btn btn-secondary">목록</a></div>
</body>
</html>
