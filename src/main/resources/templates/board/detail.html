<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 내용</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 th:text="${post.title}">제목</h2>
    <hr>
    <p><strong>작성자:</strong> <span th:text="${post.nickname}">닉네임</span></p>
    <p><strong>작성일:</strong> <span th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd HH:mm')}">날짜</span></p>
    <div class="p-3 border bg-light" th:text="${post.content}">내용</div>
    
    <div class="mt-3">
        <a href="/board" class="btn btn-secondary">목록으로</a>
    </div>
</body>
</html>
