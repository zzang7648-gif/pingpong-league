<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>익명 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>💬 익명 게시판</h2>
    <a href="/board/write" class="btn btn-primary mb-3">글쓰기</a>
    
    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>날짜</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}">1</td>
                <td><a th:href="@{/board/{id}(id=${post.id})}" th:text="${post.title}">제목</a></td>
                <td th:text="${post.nickname}">익명</td>
                <td th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd HH:mm')}">시간</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
