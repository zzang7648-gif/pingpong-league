<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>용품 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4" style="max-width: 600px;">
    <h3 class="fw-bold mb-4">용품 수정 — <span th:text="${equipment.playerName}" class="text-primary"></span></h3>

    <form th:action="@{/equipment/edit/{id}(id=${equipment.id})}" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">탁구채</label>
            <input type="text" name="blade" class="form-control"
                   th:value="${equipment.blade}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">앞면 러버</label>
            <input type="text" name="frontRubber" class="form-control"
                   th:value="${equipment.frontRubber}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">뒷면 러버</label>
            <input type="text" name="backRubber" class="form-control"
                   th:value="${equipment.backRubber}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">메모</label>
            <input type="text" name="memo" class="form-control"
                   th:value="${equipment.memo}">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">저장</button>
            <a href="/equipment" class="btn btn-outline-secondary">취소</a>
        </div>
    </form>
</body>
</html>
