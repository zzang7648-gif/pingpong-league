<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>선수 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid mt-4 px-4">
    <h2 class="mb-4">🏓 탁구 선수 관리 시스템</h2>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">새 선수 등록</div>
        <div class="card-body">
            <form action="/players/save" method="post" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="name" class="form-control" placeholder="이름" required>
                </div>
                <div class="col-md-5">
                    <input type="number" name="grade" class="form-control" placeholder="등급 (숫자)" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">등록</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">0 ~ 3부</div>
                <div class="table-responsive">
                    <table class="table table-hover table-sm mb-0">
                        <thead class="table-light"><tr><th>이름</th><th>등급</th><th>승률</th><th>관리</th></tr></thead>
                        <tbody>
                            <tr th:each="player : ${players}" th:if="${player.grade <= 3}">
                                <td th:text="${player.name}"></td>
                                <td th:text="${player.grade}"></td>
                                <td th:text="${player.win + player.lose == 0 ? 0 : #numbers.formatDecimal((player.win * 100.0) / (player.win + player.lose), 1, 0)} + '%'"></td>
                                <td>
                                    <a th:href="@{/players/delete(id=${player.id})}" class="btn btn-sm btn-outline-danger">삭제</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">4 ~ 6부</div>
                <div class="table-responsive">
                    <table class="table table-hover table-sm mb-0">
                        <thead class="table-light"><tr><th>이름</th><th>등급</th><th>승률</th><th>관리</th></tr></thead>
                        <tbody>
                            <tr th:each="player : ${players}" th:if="${player.grade >= 4 && player.grade <= 6}">
                                <td th:text="${player.name}"></td>
                                <td th:text="${player.grade}"></td>
                                <td th:text="${player.win + player.lose == 0 ? 0 : #numbers.formatDecimal((player.win * 100.0) / (player.win + player.lose), 1, 0)} + '%'"></td>
                                <td>
                                    <a th:href="@{/players/delete(id=${player.id})}" class="btn btn-sm btn-outline-danger">삭제</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">7부 이상</div>
                <div class="table-responsive">
                    <table class="table table-hover table-sm mb-0">
                        <thead class="table-light"><tr><th>이름</th><th>등급</th><th>승률</th><th>관리</th></tr></thead>
                        <tbody>
                            <tr th:each="player : ${players}" th:if="${player.grade >= 7}">
                                <td th:text="${player.name}"></td>
                                <td th:text="${player.grade}"></td>
                                <td th:text="${player.win + player.lose == 0 ? 0 : #numbers.formatDecimal((player.win * 100.0) / (player.win + player.lose), 1, 0)}
