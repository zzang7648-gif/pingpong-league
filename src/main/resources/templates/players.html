<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선수 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { background: #f4f5f7; font-family: 'Noto Sans KR', sans-serif; }

        .page-header {
            background: #1a1a2e;
            color: #fff;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
        }
        .page-header h2 { font-size: 1.2rem; font-weight: 700; margin: 0; }

        .section-card {
            background: #fff;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(0,0,0,0.07);
        }
        .section-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 0.75rem;
        }

        /* 선수 추가 폼 */
        .add-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        .add-form .form-group { display: flex; flex-direction: column; gap: 4px; }
        .add-form label { font-size: 0.78rem; color: #888; font-weight: 500; }
        .add-form input, .add-form select {
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Noto Sans KR', sans-serif;
            background: #f8f9fa;
        }
        .add-form input:focus, .add-form select:focus {
            outline: none;
            border-color: #1a1a2e;
            background: #fff;
        }
        .btn-add {
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            height: 42px;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .btn-add:hover { background: #2d2d4e; }

        /* 부수별 그리드 */
        .grade-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .grade-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.07);
            overflow: hidden;
        }

        .grade-header {
            padding: 0.6rem 1rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            letter-spacing: 0.04em;
        }

        .grade-h0  { background: #e50914; }
        .grade-h4  { background: #f5a623; }
        .grade-h5  { background: #4caf50; }
        .grade-h6  { background: #2196f3; }
        .grade-h7  { background: #9c27b0; }
        .grade-h8  { background: #607d8b; }

        /* 선수 아이템 */
        .player-item {
            display: flex;
            align-items: center;
            padding: 0.6rem 0.85rem;
            border-bottom: 1px solid #f0f0f0;
            gap: 8px;
        }
        .player-item:last-child { border-bottom: none; }

        .player-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: #1a1a2e;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-record {
            font-size: 0.72rem;
            color: #aaa;
            white-space: nowrap;
        }

        .elo-badge {
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            font-weight: 500;
            background: #e8eaff;
            color: #3d5af1;
            padding: 2px 8px;
            border-radius: 99px;
            white-space: nowrap;
        }

        .btn-edit {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #fff;
            color: #555;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .btn-edit:hover { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }

        .empty-msg {
            padding: 1rem;
            text-align: center;
            font-size: 0.82rem;
            color: #ccc;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .grade-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .grade-grid { grid-template-columns: 1fr; }
            .add-form { flex-direction: column; }
            .add-form .form-group { width: 100%; }
            .add-form input, .add-form select { width: 100%; }
            .btn-add { width: 100%; }
        }
    </style>
</head>
    <body>

    <div th:replace="~{layout/header :: header}"></div>

   <div class="page-header">
        <h2>🏓 선수 관리</h2>
        <div class="admin-buttons" th:if="${isAdmin}">
            <a href="/admin/dashboard" class="btn btn-danger btn-sm">⚙️ 관리자 패널</a>
            <a href="/admin/logout" class="btn btn-secondary btn-sm">🚪 로그아웃</a>
        </div>
        <div th:if="${!isAdmin}">
            <a href="/admin/login" class="btn btn-outline-primary btn-sm">🔐 관리자 로그인</a>
        </div>
    </div>

    <div class="container-fluid px-3 pb-5">
         <div th:if="${topPlayers != null && topPlayers.size() > 0}" class="section-card">
            <div class="section-label">🏆 TOP 10</div>
            <div class="top10-table">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 45px;">순위</th>
                            <th style="width: 50px;">이름</th>
                            <th style="width: 50px;">승</th>
                            <th style="width: 50px;">패</th>
                            <th style="width: 70px;">ELO</th>
                            <th style="width: 60px;">부수</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="player, stat : ${topPlayers}">
                            <td class="rank-cell">
                                <span th:if="${stat.index == 0}" style="color: #ffd700; font-size: 1.2rem;">🥇</span>
                                <span th:if="${stat.index == 1}" style="color: #c0c0c0; font-size: 1.1rem;">🥈</span>
                                <span th:if="${stat.index == 2}" style="color: #cd7f32; font-size: 1rem;">🥉</span>
                                <span th:if="${stat.index >= 3}" th:text="${stat.index + 1}" style="font-weight: 700; color: #666;"></span>
                            </td>
                            <td class="name-cell" th:text="${player.name}"></td>
                            <td class="record-cell" th:text="${player.win}"></td>
                            <td class="record-cell" th:text="${player.lose}"></td>
                            <td class="elo-cell" th:text="${player.elo}"></td>
                            <td th:text="${player.grade}" style="font-size: 0.8rem; color: #666;"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>



        <!-- 선수 추가 -->
    <div th:if="${isAdmin}" class="section-card">
        <div class="section-card">
            <div class="section-label">선수 추가</div>
            <form action="/players/save" method="post">
                <div class="add-form">
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" name="name" placeholder="이름 입력" required style="width:140px;">
                    </div>
                    <div class="form-group">
                        <label>부수</label>
                        <select name="grade" style="width:110px;">
                            <option value="1부">1부</option>
                            <option value="2부">2부</option>
                            <option value="3부">3부</option>
                            <option value="4부">4부</option>
                            <option value="5부">5부</option>
                            <option value="6부">6부</option>
                            <option value="7부">7부</option>
                            <option value="8부">8부</option>
                            <option value="없음">없음</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-add">등록</button>
                </div>
            </form>
        </div>
    </div>
        
        <!-- 부수별 선수 목록 -->
        <div class="section-label px-1">부수별 선수 목록</div>
        <div class="grade-grid">

            <!-- 0~3부 -->
            <div class="grade-card">
                <div class="grade-header grade-h0">0 ~ 3부</div>
                <div th:if="${#lists.isEmpty(p0_3)}" class="empty-msg">없음</div>
                <div th:each="player : ${p0_3}" class="player-item">
                    <div>
                        <div class="player-name" th:text="${player.name}"></div>
                        <div class="player-record" th:text="${player.win + '승 ' + player.lose + '패'}"></div>
                    </div>
                    <span class="elo-badge" th:text="${player.elo}"></span>
                    <a th:href="@{/players/edit(id=${player.id})}" class="btn-edit">수정</a>
                </div>
            </div>

            <!-- 4부 -->
            <div class="grade-card">
                <div class="grade-header grade-h4">4부</div>
                <div th:if="${#lists.isEmpty(p4)}" class="empty-msg">없음</div>
                <div th:each="player : ${p4}" class="player-item">
                    <div>
                        <div class="player-name" th:text="${player.name}"></div>
                        <div class="player-record" th:text="${player.win + '승 ' + player.lose + '패'}"></div>
                    </div>
                    <span class="elo-badge" th:text="${player.elo}"></span>
                    <a th:href="@{/players/edit(id=${player.id})}" class="btn-edit">수정</a>
                </div>
            </div>

            <!-- 5부 -->
            <div class="grade-card">
                <div class="grade-header grade-h5">5부</div>
                <div th:if="${#lists.isEmpty(p5)}" class="empty-msg">없음</div>
                <div th:each="player : ${p5}" class="player-item">
                    <div>
                        <div class="player-name" th:text="${player.name}"></div>
                        <div class="player-record" th:text="${player.win + '승 ' + player.lose + '패'}"></div>
                    </div>
                    <span class="elo-badge" th:text="${player.elo}"></span>
                    <a th:href="@{/players/edit(id=${player.id})}" class="btn-edit">수정</a>
                </div>
            </div>

            <!-- 6부 -->
            <div class="grade-card">
                <div class="grade-header grade-h6">6부</div>
                <div th:if="${#lists.isEmpty(p6)}" class="empty-msg">없음</div>
                <div th:each="player : ${p6}" class="player-item">
                    <div>
                        <div class="player-name" th:text="${player.name}"></div>
                        <div class="player-record" th:text="${player.win + '승 ' + player.lose + '패'}"></div>
                    </div>
                    <span class="elo-badge" th:text="${player.elo}"></span>
                    <a th:href="@{/players/edit(id=${player.id})}" class="btn-edit">수정</a>
                </div>
            </div>

            <!-- 7부 -->
            <div class="grade-card">
                <div class="grade-header grade-h7">7부</div>
                <div th:if="${#lists.isEmpty(p7)}" class="empty-msg">없음</div>
                <div th:each="player : ${p7}" class="player-item">
                    <div>
                        <div class="player-name" th:text="${player.name}"></div>
                        <div class="player-record" th:text="${player.win + '승 ' + player.lose + '패'}"></div>
                    </div>
                    <span class="elo-badge" th:text="${player.elo}"></span>
                    <a th:href="@{/players/edit(id=${player.id})}" class="btn-edit">수정</a>
                </div>
            </div>

            <!-- 8~10부 -->
            <div class="grade-card">
                <div class="grade-header grade-h8">8 ~ 10부</div>
                <div th:if="${#lists.isEmpty(p8_10)}" class="empty-msg">없음</div>
                <div th:each="player : ${p8_10}" class="player-item">
                    <div>
                        <div class="player-name" th:text="${player.name}"></div>
                        <div class="player-record" th:text="${player.win + '승 ' + player.lose + '패'}"></div>
                    </div>
                    <span class="elo-badge" th:text="${player.elo}"></span>
                    <a th:href="@{/players/edit(id=${player.id})}" class="btn-edit">수정</a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
