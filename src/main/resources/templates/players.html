<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>선수 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-4">🏓 탁구 선수 관리 시스템</h2>

    <!-- 1분할: 선수 등록 섹션 -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">새 선수 등록</div>
        <div class="card-body">
            <form action="/players/save" method="post" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="name" class="form-control" placeholder="이름" required>
                </div>
                <div class="col-md-5">
                    <input type="text" name="grade" class="form-control" placeholder="등급" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">등록</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2분할: 통계 및 요약 (추후 확장용) -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="alert alert-info">
                현재 총 <strong><span th:text="${#lists.size(players)}">0</span></strong>명의 선수가 등록되어 있습니다.
            </div>
        </div>
    </div>

    <!-- 3분할: 선수 목록 (데이터 테이블) -->
    <div class="card">
        <div class="card-header bg-dark text-white">선수 상세 목록</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>번호</th><th>이름</th><th>등급</th><th>승</th><th>패</th><th>승률</th><th>관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="player : ${players}">
                        <td th:text="${player.id}">1</td>
                        <td th:text="${player.name}">홍길동</td>
                        <td th:text="${player.grade}">S</td>
                        <td th:text="${player.win}">0</td>
                        <td th:text="${player.lose}">0</td>
                        <td>
                            <span th:text="${player.win + player.lose == 0 ? 0 : #numbers.formatDecimal((player.win * 100.0) / (player.win + player.lose), 1, 1)}">0</span>%
                        </td>
                        <td>
                            <a th:href="@{/players/edit(id=${player.id})}" class="btn btn-outline-warning btn-sm">수정</a>
                            <a th:href="@{/players/delete(id=${player.id})}" class="btn btn-outline-danger btn-sm">삭제</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
