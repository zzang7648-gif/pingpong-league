<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>🏓 탁구 선수 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table { font-size: 0.85rem; } /* 좁은 공간을 위해 폰트 축소 */
        .card-header { font-weight: bold; font-size: 0.9rem; }
        .btn-sm { padding: 0.1rem 0.3rem; font-size: 0.75rem; }
        .badge-elo { background-color: #0d6efd; color: white; }

        body { background-color: #f8f9fa; padding: 10px; }
    
    /* 테이블을 매우 촘촘하게 만듭니다 */
    .table td, .table th { 
        padding: 0.2rem !important; 
        font-size: 0.75rem !important; 
        white-space: nowrap; /* 글자가 줄바꿈되지 않게 */
    }
    
    /* 카드 높이 고정 및 스크롤 방지 */
    .card { height: auto !important; margin-bottom: 10px; }
    
    /* 배지 크기 조정 */
    .badge { font-size: 0.65rem; padding: 2px 4px; }
    
    /* 버튼 크기 더 줄이기 */
    .btn-sm { padding: 0px 4px; font-size: 0.7rem; }
    
    /* 6등분 레이아웃이 좁을 때 가로 스크롤 방지 */
    .container-fluid { padding-left: 5px; padding-right: 5px; }
    .row { margin-left: 0; margin-right: 0; }
    </style>
</head>
<body>

<div class="container-fluid mt-4 px-4">
    <h2 class="mb-4 text-primary fw-bold">🏓 탁구 선수 관리 시스템</h2>

    <div class="card mb-3 shadow-sm">
    <div class="card-body py-2">
            <form action="/players/save" method="post" class="row g-2 align-items-center">
                <div class="col-auto">
                    <span class="fw-bold small">선수 추가:</span>
                </div>
                <div class="col-md-3">
                    <input type="text" name="name" class="form-control form-control-sm" placeholder="이름" required>
                </div>
                <div class="col-md-2">
                    <input type="number" name="grade" class="form-control form-control-sm" placeholder="등급" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-sm btn-primary px-3">등록</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-2">
        <div class="col-md-2" th:each="entry : ${ {
            {'0 ~ 3부', p0_3}, {'4부', p4}, {'5부', p5}, 
            {'6부', p6}, {'7부', p7}, {'8 ~ 10부', p8_10} } }">
            
            <div class="card shadow-sm h-100">
                <div class="card-header bg-secondary text-white text-center" th:text="${entry[0]}">등급명</div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>이름</th>
                                <th>Elo</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="player : ${entry[1]}">
                                <td>
                                    <strong th:text="${player.name}">이름</strong><br>
                                    <small class="text-muted" th:text="${player.win + '승 ' + player.lose + '패'}">0승 0패</small>
                                </td>
                                <td class="align-middle">
                                    <span class="badge badge-elo" th:text="${player.elo}">1500</span>
                                </td>
                                <td class="align-middle text-center">
                                    <div class="d-flex justify-content-center gap-1">
                                        <a th:href="@{/players/edit(id=${player.id})}" class="btn btn-sm btn-outline-primary" style="font-size: 0.65rem; padding: 1px 4px;">수정</a>
                                        <a th:href="@{/players/delete(id=${player.id})}" class="btn btn-sm btn-outline-danger" style="font-size: 0.65rem; padding: 1px 4px;">삭제</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
