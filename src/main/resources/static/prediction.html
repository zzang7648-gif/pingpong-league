<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>승부 예측</title>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7fa;
      --bg2: #ffffff;
      --border: #e0e6ed;
      --text: #2c3e50;
      --text2: #7f8c8d;
      --accent: #3498db;
      --accent2: #2980b9;
      --success: #27ae60;
      --danger: #e74c3c;
    }
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border);
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    .home-btn {
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }
    .home-btn:hover { background: var(--accent2); }

    .main-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .section {
      background: var(--bg2);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid var(--border);
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--text);
    }

    /* 달력 */
    .calendar {
      width: 100%;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .calendar-header button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .calendar-header span {
      font-weight: 600;
      font-size: 14px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      background: var(--bg);
      transition: all 0.2s;
    }
    .calendar-day:hover { background: #e3f2fd; }
    .calendar-day.other-month { color: var(--text2); }
    .calendar-day.selected {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .calendar-day.has-events::after {
      content: '•';
      position: absolute;
      font-size: 16px;
      color: var(--success);
    }

    /* 경기 목록 */
    .events-section {
      grid-column: 2;
    }
    .event-card {
      background: var(--bg);
      border-left: 4px solid var(--accent);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .event-card:hover { background: #e3f2fd; }
    .event-card.selected {
      background: #e3f2fd;
      border-left-color: var(--success);
    }
    .event-name {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .event-date {
      font-size: 12px;
      color: var(--text2);
    }

    /* 예측 폼 */
    .prediction-form {
      display: none;
    }
    .prediction-form.active { display: block; }
    .form-group {
      margin-bottom: 15px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .player-btn {
      padding: 10px;
      border: 2px solid var(--border);
      background: var(--bg);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .player-btn:hover {
      border-color: var(--accent);
      background: #e3f2fd;
    }
    .player-btn.selected {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .selection-display {
      padding: 10px;
      background: #f0f8ff;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .selection-display strong {
      color: var(--accent);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--success);
      color: white;
    }
    .btn-primary:hover { background: #229954; }
    .btn-primary:disabled { background: var(--text2); cursor: not-allowed; }
    .btn-reset {
      background: #ecf0f1;
      color: var(--text);
    }
    .btn-reset:hover { background: #d5dbdb; }

    /* 예측 결과 */
    .predictions-section {
      grid-column: 1 / -1;
    }
    .prediction-list {
      max-height: 300px;
      overflow-y: auto;
    }
    .prediction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .prediction-item:last-child { border-bottom: none; }
    .prediction-name {
      font-weight: 600;
      min-width: 70px;
    }
    .prediction-result {
      display: flex;
      gap: 15px;
      flex: 1;
      justify-content: center;
    }
    .prediction-rank {
      text-align: center;
    }
    .prediction-rank .label {
      font-size: 10px;
      color: var(--text2);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .prediction-rank .value {
      font-weight: 700;
      color: var(--accent);
    }
    .prediction-correct {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .prediction-correct.yes {
      background: #d3f9e5;
      color: var(--success);
    }
    .prediction-correct.no {
      background: #ffe3e3;
      color: var(--danger);
    }
    .empty-message {
      text-align: center;
      padding: 20px;
      color: var(--text2);
      font-size: 13px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .events-section {
        grid-column: 1;
      }
      .players-grid {
        grid-template-columns: 1fr;
      }
    }
    </style>
     </head>
        <body>
        <div class="container">
          <header>
            <div class="logo">🏆 승부 예측</div>
            <div>
              <a href="/event-management.html" class="home-btn" style="background: #f39c12; margin-right: 10px;">⚙️ 경기 관리</a>
              <a href="/" class="home-btn">🏠 홈으로</a>
            </div>
          </header>

          

          <div class="main-grid">
            <!-- 달력 -->
            <div class="section">
              <div class="section-title">📅 날짜 선택</div>
              <div class="calendar">
                <div class="calendar-header">
                  <button onclick="prevMonth()">◀</button>
                  <span id="currentMonth"></span>
                  <button onclick="nextMonth()">▶</button>
                </div>
                <div class="calendar-grid" id="calendar"></div>
              </div>
            </div>

            <!-- 경기 목록 & 예측 폼 -->
            <div class="section">
              <div class="section-title">📝 경기 선택</div>
              
              <!-- 경기 목록 -->
              <div id="eventsContainer" style="display: none;">
                <div id="eventsList"></div>
              </div>
              <div id="noEvents" class="empty-message">
                선택된 날짜에 경기가 없습니다
              </div>

              <!-- 예측 폼 -->
              <div class="prediction-form" id="predictionForm">
                <div class="form-group">
                  <label class="form-label">이름</label>
                  <input type="text" id="userName" class="form-input" placeholder="예: 홍길동" maxlength="20">
                </div>

                <div class="form-group">
                  <label class="form-label">1등 예측</label>
                  <div class="selection-display">
                    1등: <strong id="firstDisplay">선택 안함</strong>
                  </div>
                  <div class="players-grid" id="firstPlayers"></div>
                </div>

                <div class="form-group">
                  <label class="form-label">2등 예측</label>
                  <div class="selection-display">
                    2등: <strong id="secondDisplay">선택 안함</strong>
                  </div>
                  <div class="players-grid" id="secondPlayers"></div>
                </div>

                <div class="btn-group">
                  <button class="btn btn-primary" onclick="submitPrediction()">✨ 예측 저장</button>
                  <button class="btn btn-reset" onclick="resetForm()">초기화</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 예측 결과 -->
          <div class="section predictions-section" id="predictionsSection" style="display: none;">
            <div class="section-title">📊 이 경기의 예측</div>
            <div class="prediction-list" id="predictionsList">
              <div class="empty-message">예측이 없습니다</div>
            </div>
          </div>
        </div>

        <script th:inline="none">
        let PLAYERS = [];

        function loadPlayers() {
          fetch('/api/players')
            .then(r => r.json())
            .then(data => {
              PLAYERS = data;
              renderCalendar();
              selectDate(selectedDate);
            })
            .catch(err => console.error('선수 로드 실패:', err));
        }
        let currentDate = new Date();
        let selectedDate = null;
        let selectedEvent = null;
        let firstSelected = null;
        let secondSelected = null;
        let events = [];

        function renderCalendar() {
          const year = currentDate.getFullYear();
          const month = currentDate.getMonth();
          
          document.getElementById('currentMonth').textContent = 
            new Date(year, month).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long' });
          
          const firstDay = new Date(year, month, 1);
          const lastDay = new Date(year, month + 1, 0);
          const daysInMonth = lastDay.getDate();
          const startDay = firstDay.getDay();
          
          const calendar = document.getElementById('calendar');
          calendar.innerHTML = '';
          
          // 요일 헤더
          const days = ['일', '월', '화', '수', '목', '금', '토'];
          days.forEach(day => {
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';
            dayEl.textContent = day;
            dayEl.style.fontWeight = 'bold';
            dayEl.style.cursor = 'default';
            calendar.appendChild(dayEl);
          });
          
          // 이전달 날짜
          for (let i = 0; i < startDay; i++) {
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day other-month';
            dayEl.textContent = new Date(year, month, -startDay + i + 1).getDate();
            calendar.appendChild(dayEl);
          }
          
          // 현재달 날짜
          for (let day = 1; day <= daysInMonth; day++) {
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';
            dayEl.textContent = day;
            
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            if (selectedDate === dateStr) {
              dayEl.classList.add('selected');
            }
            
            dayEl.onclick = () => selectDate(dateStr);
            calendar.appendChild(dayEl);
          }
          
          // 다음달 날짜
          const remainingDays = 42 - (startDay + daysInMonth);
          for (let i = 1; i <= remainingDays; i++) {
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day other-month';
            dayEl.textContent = i;
            calendar.appendChild(dayEl);
          }
        }

        function prevMonth() {
          currentDate.setMonth(currentDate.getMonth() - 1);
          renderCalendar();
        }

        function nextMonth() {
          currentDate.setMonth(currentDate.getMonth() + 1);
          renderCalendar();
        }

        function selectDate(dateStr) {
          selectedDate = dateStr;
          selectedEvent = null;
          firstSelected = null;
          secondSelected = null;
          document.getElementById('predictionForm').classList.remove('active');
          document.getElementById('predictionsSection').style.display = 'none';
          
          renderCalendar();
          loadEvents(dateStr);
        }

        function loadEvents(dateStr) {
          fetch(`/api/events?date=${dateStr}`)
            .then(r => r.json())
            .then(data => {
              events = data.events || [];
              renderEventsList();
            })
            .catch(err => console.error('경기 로드 실패:', err));
        }

        function renderEventsList() {
          const container = document.getElementById('eventsContainer');
          const noEvents = document.getElementById('noEvents');
          const eventsList = document.getElementById('eventsList');
          
          if (events.length === 0) {
            container.style.display = 'none';
            noEvents.style.display = 'block';
            return;
          }
          
          container.style.display = 'block';
          noEvents.style.display = 'none';
          eventsList.innerHTML = events.map(e => `
            <div class="event-card" onclick="selectEvent(${e.id})">
              <div class="event-name">${e.eventName}</div>
              <div class="event-date">${e.eventDate}</div>
            </div>
          `).join('');
        }

        function selectEvent(eventId) {
          selectedEvent = eventId;
          document.querySelector('.event-card.selected')?.classList.remove('selected');
          event.currentTarget.classList.add('selected');
          
          document.getElementById('predictionForm').classList.add('active');
          loadPredictions(eventId);
          
          // 플레이어 버튼 초기화
          initPlayers();
        }

        function initPlayers() {
          const firstContainer = document.getElementById('firstPlayers');
          const secondContainer = document.getElementById('secondPlayers');
          firstContainer.innerHTML = '';
          secondContainer.innerHTML = '';
          
          PLAYERS.forEach(player => {
            const btn1 = document.createElement('button');
            btn1.className = 'player-btn';
            btn1.textContent = player;
            btn1.onclick = () => selectFirst(player, btn1);
            firstContainer.appendChild(btn1);
            
            const btn2 = document.createElement('button');
            btn2.className = 'player-btn';
            btn2.textContent = player;
            btn2.onclick = () => selectSecond(player, btn2);
            secondContainer.appendChild(btn2);
          });
        }

        function selectFirst(player, btn) {
          document.querySelectorAll('#firstPlayers .player-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          firstSelected = player;
          document.getElementById('firstDisplay').textContent = player;
        }

        function selectSecond(player, btn) {
          document.querySelectorAll('#secondPlayers .player-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          secondSelected = player;
          document.getElementById('secondDisplay').textContent = player;
        }

        function resetForm() {
          document.getElementById('userName').value = '';
          firstSelected = null;
          secondSelected = null;
          document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('selected'));
          document.getElementById('firstDisplay').textContent = '선택 안함';
          document.getElementById('secondDisplay').textContent = '선택 안함';
        }

        function submitPrediction() {
          const name = document.getElementById('userName').value.trim();
          
          if (!name) {
            alert('이름을 입력해주세요');
            return;
          }
          if (!firstSelected || !secondSelected) {
            alert('1등과 2등을 모두 선택해주세요');
            return;
          }
          if (firstSelected === secondSelected) {
            alert('1등과 2등은 다른 선수여야 합니다');
            return;
          }
          
          const formData = new FormData();
          formData.append('eventId', selectedEvent);
          formData.append('userName', name);
          formData.append('predictedFirst', firstSelected);
          formData.append('predictedSecond', secondSelected);
          
          fetch('/prediction/save', {
            method: 'POST',
            body: formData
          })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              alert('예측이 저장되었습니다!');
              resetForm();
              loadPredictions(selectedEvent);
            } else {
              alert('저장 실패: ' + data.message);
            }
          })
          .catch(err => console.error('저장 실패:', err));
        }

        function loadPredictions(eventId) {
          fetch(`/api/event/${eventId}`)
            .then(r => r.json())
            .then(predictions => {
              renderPredictions(predictions);
            })
            .catch(err => console.error('예측 로드 실패:', err));
        }

        function renderPredictions(predictions) {
          const section = document.getElementById('predictionsSection');
          const list = document.getElementById('predictionsList');
          
          if (!predictions || predictions.length === 0) {
            section.style.display = 'block';
            list.innerHTML = '<div class="empty-message">예측이 없습니다</div>';
            return;
          }
          
          section.style.display = 'block';
          list.innerHTML = predictions.map(p => `
            <div class="prediction-item">
              <div class="prediction-name">${p.userName}</div>
              <div class="prediction-result">
                <div class="prediction-rank">
                  <div class="label">1등</div>
                  <div class="value">${p.predictedFirst}</div>
                </div>
                <div class="prediction-rank">
                  <div class="label">2등</div>
                  <div class="value">${p.predictedSecond}</div>
                </div>
              </div>
              ${p.isCorrect !== null ? `
                <div class="prediction-correct ${p.isCorrect ? 'yes' : 'no'}">
                  ${p.isCorrect ? '✓ 맞음' : '✗ 틀림'}
                </div>
              ` : ''}
            </div>
          `).join('');
        }

        // 초기화
        selectedDate = new Date().toISOString().split('T')[0];
        loadPlayers();
        </script>
      </body>
</html>
